<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMC (versão médico) — Painel Cognisa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --teal:#1F3B36; --teal-light:#2C5048; --gold:#B8915A; --gold-soft:#D9BD93;
    --ivory:#F4F1EA; --ink:#1A1A17; --ok:#5B7A5B; --warn:#B8863A; --alert:#A84B3A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ivory);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.5;}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px 80px;}

  header.top{
    background:var(--teal);color:var(--ivory);
    padding:28px 24px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;
  }
  header.top h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;}
  header.top .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:4px;}
  .backlink{color:var(--gold-soft);text-decoration:none;font-size:13px;font-weight:500;}
  .backlink:hover{color:var(--ivory);}

  .patientbar{
    background:#fff;border-bottom:1.5px solid #DDD6C7;padding:12px 24px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  }
  .patientbar .pid{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:17px;color:var(--teal);}
  .patientbar .sub{font-size:12.5px;color:#8a8578;margin-left:8px;}

  .notice{background:#fff;border:1.5px solid var(--alert);border-left:6px solid var(--alert);border-radius:6px;padding:16px 18px;margin:28px 24px;font-size:14px;color:var(--teal);max-width:592px;}

  .measures{background:#fff;border-radius:10px;padding:20px 22px;margin:24px 0 20px;box-shadow:0 1px 3px rgba(31,59,54,.08);display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .measures label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
  .measures input{width:100%;font-family:'DM Sans',sans-serif;font-size:16px;padding:10px 12px;border:1.5px solid #DDD6C7;border-radius:6px;background:#FBFAF7;color:var(--ink);}
  .measures input:focus{outline:none;border-color:var(--gold);}
  @media (max-width:480px){.measures{grid-template-columns:1fr;}}

  .result{margin-top:24px;padding:26px;border-radius:12px;background:var(--teal);color:var(--ivory);text-align:center;}
  .result .score{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:700;line-height:1;color:var(--gold-soft);}
  .result .score-label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:4px;}
  .result .category{font-size:19px;font-weight:700;margin:12px 0 4px;}
  .result .note{margin-top:14px;font-size:13.5px;color:#F0D9B8;max-width:440px;margin-left:auto;margin-right:auto;}

  .actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap;}
  button{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;padding:12px 24px;border-radius:8px;border:none;cursor:pointer;transition:.15s;}
  #calcBtn,#saveBtn{background:var(--gold);color:var(--teal);}
  #calcBtn:hover,#saveBtn:hover{background:var(--gold-soft);}
  #saveBtn:disabled{opacity:.6;cursor:default;}
  .saveflash{display:none;color:var(--gold-soft);font-size:13px;margin-top:10px;}
  .saveflash.show{display:block;}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="eyebrow">Cognisa · Escalas Médicos · Deméter</div>
    <h1>Calculadora de IMC</h1>
  </div>
  <a class="backlink" href="escalas.html">← Escalas Médicos</a>
</header>

<div class="patientbar" id="patientBar" style="display:none;">
  <span class="pid" id="patientId">—</span><span class="sub" id="patientSub"></span>
</div>

<div id="noPatientNotice" class="notice" style="display:none;">
  Nenhum paciente selecionado. Volte para <a href="escalas.html">Escalas Médicos</a> e escolha um paciente primeiro.
</div>

<div class="wrap" id="formWrap" style="display:none;">

  <div class="measures">
    <div><label for="peso">Peso (kg)</label><input type="number" id="peso" step="0.1" placeholder="Ex.: 68.5"></div>
    <div><label for="altura">Altura (m)</label><input type="number" id="altura" step="0.01" placeholder="Ex.: 1.65"></div>
  </div>

  <div class="actions">
    <button id="calcBtn">Calcular e salvar</button>
  </div>

  <div class="result" id="result" style="display:none;">
    <div class="score-label">IMC</div>
    <div class="score" id="scoreValue">–</div>
    <div class="category" id="category">–</div>
    <div class="note" id="note"></div>
    <div class="saveflash" id="saveFlash">Salvo no Mapa de variáveis.</div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://wkubjtnwipqlrynauvpa.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_H0O-YMO7H7QA-dZIQbZnJQ_AdaCXWtb";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentPatient = null;
  let lastPeso = null, lastImc = null;

  function formatDate(iso){
    if(!iso) return '';
    const [ano, mes, dia] = iso.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  function classificarIMC(imc){
    if(imc < 22) return {cat:'Abaixo do peso', cor:'var(--warn)', nota:'Risco de fragilidade/sarcopenia — investigar apetite, ingestão alimentar e perda de peso recente.'};
    if(imc < 27) return {cat:'Peso adequado', cor:'var(--ok)', nota:'Faixa considerada protetora para o adulto mais velho.'};
    if(imc < 30) return {cat:'Sobrepeso', cor:'var(--warn)', nota:'Sobrepeso leve nesta faixa etária nem sempre exige ação imediata.'};
    return {cat:'Obesidade', cor:'var(--alert)', nota:'Avaliar acompanhamento nutricional combinado com preservação de força muscular.'};
  }

  function calcular(){
    const pesoVal = document.getElementById('peso').value;
    const alturaVal = document.getElementById('altura').value;

    if(!pesoVal || !alturaVal){
      alert('Preencha peso e altura para calcular.');
      return;
    }

    const peso = parseFloat(pesoVal);
    const altura = parseFloat(alturaVal);
    const imc = peso / (altura * altura);
    const {cat, cor, nota} = classificarIMC(imc);

    lastPeso = peso;
    lastImc = imc;

    document.getElementById('scoreValue').textContent = imc.toFixed(1);
    const catEl = document.getElementById('category');
    catEl.textContent = cat;
    catEl.style.color = cor;
    document.getElementById('note').textContent = nota;
    document.getElementById('result').style.display = 'block';
    document.getElementById('saveFlash').classList.remove('show');
    salvarNoProntuario();
  }

  document.getElementById('calcBtn').addEventListener('click', calcular);

  async function salvarNoProntuario(){
    if (!currentPatient || lastImc === null) return;

    const now = new Date().toISOString();
    const { error } = await client.from('patient_variables').upsert([
      { patient_id: currentPatient.id, variable_id: 'V53', value: String(lastPeso), updated_at: now },
      { patient_id: currentPatient.id, variable_id: 'V54', value: lastImc.toFixed(1), updated_at: now }
    ], { onConflict: 'patient_id,variable_id' });

    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    document.getElementById('saveFlash').classList.add('show');
  }

  async function requireSession(){
    const { data } = await client.auth.getSession();
    if (!data.session) { window.location.href = "login.html"; return null; }
    return data.session;
  }

  (async () => {
    const session = await requireSession();
    if (!session) return;

    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('patient_id');
    if (!patientId) { document.getElementById('noPatientNotice').style.display = 'block'; return; }

    const { data, error } = await client
      .from('patients')
      .select('id, initials, birth_date, medical_record_number')
      .eq('id', patientId)
      .maybeSingle();

    if (error || !data) { document.getElementById('noPatientNotice').style.display = 'block'; return; }

    currentPatient = data;
    document.getElementById('patientBar').style.display = 'flex';
    document.getElementById('patientId').textContent =
      `${data.initials}-${(data.birth_date || '').replace(/-/g,'').slice(2)}`;
    document.getElementById('patientSub').textContent =
      ` · Nascimento ${formatDate(data.birth_date)}${data.medical_record_number ? ' · Prontuário ' + data.medical_record_number : ''}`;
    document.getElementById('formWrap').style.display = 'block';
  })();
</script>

</body>
</html>
