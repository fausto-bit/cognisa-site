<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Painel Cognisa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --teal:#1F3B36; --gold:#B8915A; --gold-soft:#D9BD93;
    --ivory:#F4F1EA; --ink:#1A1A17; --alert:#A84B3A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal);
    font-family:'DM Sans',sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .box{
    background:var(--ivory);
    border-radius:14px;
    padding:40px 36px;
    max-width:380px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:6px;}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;
    text-align:center;color:var(--teal);margin-bottom:28px;
  }
  label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;margin-top:16px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%;padding:11px 12px;border:1.5px solid #DDD6C7;border-radius:7px;
    font-family:'DM Sans',sans-serif;font-size:15px;background:#fff;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--gold);}
  button{
    width:100%;margin-top:24px;background:var(--teal);color:var(--ivory);
    border:none;border-radius:8px;padding:13px;font-family:'DM Sans',sans-serif;
    font-weight:700;font-size:15px;cursor:pointer;transition:.15s;
  }
  button:hover{background:#2C5048;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:16px;font-size:13.5px;text-align:center;}
  .msg.error{color:var(--alert);}
  .backlink{display:block;text-align:center;margin-top:20px;font-size:13px;color:#8a8578;text-decoration:none;}
</style>
</head>
<body>

<div class="box">
  <div class="eyebrow">Cognisa</div>
  <h1>Painel privado</h1>
  <form id="loginForm">
    <label for="email">E-mail</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Senha</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" id="submitBtn">Entrar</button>
    <div class="msg" id="msg"></div>
  </form>
  <a class="backlink" href="../index.html">← Voltar ao site</a>
</div>

<script>
  const SUPABASE_URL = "https://wkubjtnwipqlrynauvpa.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_H0O-YMO7H7QA-dZIQbZnJQ_AdaCXWtb";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Se já tem sessão válida, pula direto pro painel.
  client.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "index.html";
  });

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = 'E-mail ou senha incorretos.';
      msg.className = 'msg error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
      return;
    }

    window.location.href = "index.html";
  });
</script>

</body>
</html>
