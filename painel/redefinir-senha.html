<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Painel Cognisa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --teal:#1F3B36; --gold:#B8915A; --gold-soft:#D9BD93;
    --ivory:#F4F1EA; --ink:#1A1A17; --alert:#A84B3A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal);
    font-family:'DM Sans',sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .box{
    background:var(--ivory);
    border-radius:14px;
    padding:40px 36px;
    max-width:380px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:6px;}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;
    text-align:center;color:var(--teal);margin-bottom:28px;
  }
  p.hint{font-size:13.5px;color:#6b6658;text-align:center;margin-bottom:20px;}
  label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;margin-top:16px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%;padding:11px 12px;border:1.5px solid #DDD6C7;border-radius:7px;
    font-family:'DM Sans',sans-serif;font-size:15px;background:#fff;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--gold);}
  button{
    width:100%;margin-top:24px;background:var(--teal);color:var(--ivory);
    border:none;border-radius:8px;padding:13px;font-family:'DM Sans',sans-serif;
    font-weight:700;font-size:15px;cursor:pointer;transition:.15s;
  }
  button:hover{background:#2C5048;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:16px;font-size:13.5px;text-align:center;}
  .msg.error{color:var(--alert);}
  .msg.success{color:var(--teal);}
  .backlink{display:block;text-align:center;margin-top:20px;font-size:13px;color:#8a8578;text-decoration:none;}
  .hidden{display:none;}
</style>
</head>
<body>

<div class="box">
  <div class="eyebrow">Cognisa</div>
  <h1>Nova senha</h1>

  <div id="checking">
    <p class="hint">Verificando o link de redefinição...</p>
  </div>

  <form id="resetForm" class="hidden">
    <p class="hint">Defina uma nova senha para acessar o painel.</p>
    <label for="password">Nova senha</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">
    <label for="password2">Confirmar nova senha</label>
    <input type="password" id="password2" required minlength="6" autocomplete="new-password">
    <button type="submit" id="submitBtn">Salvar nova senha</button>
    <div class="msg" id="msg"></div>
  </form>

  <div id="invalid" class="hidden">
    <p class="hint">Este link de redefinição é inválido ou expirou. Solicite um novo na tela de login.</p>
  </div>

  <a class="backlink" href="login.html">← Voltar ao login</a>
</div>

<script>
  const SUPABASE_URL = "https://wkubjtnwipqlrynauvpa.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_H0O-YMO7H7QA-dZIQbZnJQ_AdaCXWtb";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const checkingEl = document.getElementById('checking');
  const resetForm = document.getElementById('resetForm');
  const invalidEl = document.getElementById('invalid');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  let recoveryReady = false;

  // O Supabase processa o token da URL automaticamente e dispara este evento
  // quando o link de recuperação de senha é válido.
  client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      checkingEl.classList.add('hidden');
      resetForm.classList.remove('hidden');
    }
  });

  // Se depois de um tempo nenhum evento de recuperação chegou, o link é inválido/expirado.
  setTimeout(() => {
    if (!recoveryReady) {
      checkingEl.classList.add('hidden');
      invalidEl.classList.remove('hidden');
    }
  }, 3000);

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';

    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      msg.textContent = 'As senhas não coincidem.';
      msg.className = 'msg error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Salvando...';

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      msg.textContent = 'Erro: ' + error.message;
      msg.className = 'msg error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Salvar nova senha';
      return;
    }

    msg.textContent = 'Senha atualizada! Redirecionando para o login...';
    msg.className = 'msg success';
    await client.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1800);
  });
</script>

</body>
</html>
