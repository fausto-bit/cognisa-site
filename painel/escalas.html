<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escalas Médicos — Painel Cognisa</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --teal:#1F3B36; --teal-light:#2C5048; --gold:#B8915A; --gold-soft:#D9BD93;
    --ivory:#F4F1EA; --ink:#1A1A17;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ivory);color:var(--ink);font-family:'DM Sans',sans-serif;line-height:1.55;}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px 80px;}

  header.top{
    background:var(--teal);color:var(--ivory);
    padding:28px 24px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;
  }
  header.top h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;}
  header.top .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:4px;}
  .panelnav{display:flex;gap:18px;flex-wrap:wrap;}
  .panelnav a{
    color:var(--gold-soft);text-decoration:none;font-size:13.5px;font-weight:500;
    padding-bottom:3px;border-bottom:2px solid transparent;
  }
  .panelnav a:hover{color:var(--ivory);}
  .panelnav a.active{color:var(--ivory);border-bottom-color:var(--gold);}
  #logoutBtn{
    background:transparent;border:1.5px solid var(--gold-soft);color:var(--ivory);
    padding:8px 16px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;
    cursor:pointer;
  }
  #logoutBtn:hover{background:rgba(255,255,255,.08);}

  .card{
    background:#fff;border-radius:12px;padding:22px 24px;margin-top:24px;
    box-shadow:0 1px 3px rgba(31,59,54,.08);
  }
  .card h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:19px;color:var(--teal);margin-bottom:14px;}

  .searchrow{display:flex;gap:10px;flex-wrap:wrap;}
  .searchrow input{
    flex:1;min-width:160px;padding:10px 12px;border:1.5px solid #DDD6C7;border-radius:7px;
    font-family:'DM Sans',sans-serif;font-size:14.5px;background:#FBFAF7;color:var(--ink);
  }
  .searchrow input:focus{outline:none;border-color:var(--gold);}
  .searchrow button{
    background:var(--gold);color:var(--teal);border:none;border-radius:7px;
    padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;
  }
  .searchrow button:hover{background:var(--gold-soft);}
  .resultlist{margin-top:14px;}
  .resultitem{
    padding:10px 12px;border-radius:7px;cursor:pointer;font-size:14.5px;
    display:flex;justify-content:space-between;
  }
  .resultitem:hover{background:var(--ivory);}
  .resultitem .sub{color:#8a8578;font-size:12.5px;}
  .empty{color:#8a8578;font-size:14px;padding:10px 0;}

  .patienthead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .patienthead .id{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--teal);}
  .patienthead .sub{font-size:13px;color:#8a8578;}
  .changepatient{
    background:transparent;border:1.5px solid var(--teal);color:var(--teal);
    border-radius:7px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .changepatient:hover{background:var(--teal);color:var(--ivory);}

  .scalegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:6px;}
  .scalecard{
    display:block;background:var(--ivory);border:1.5px solid #DDD6C7;border-radius:10px;
    padding:14px 16px;text-decoration:none;color:var(--ink);
  }
  .scalecard:hover{border-color:var(--gold);}
  .scalecard .name{font-weight:700;color:var(--teal);font-size:14.5px;margin-bottom:3px;}
  .scalecard .desc{font-size:12.5px;color:#6b6b60;}
  .scalecard.disabled{opacity:.5;cursor:default;pointer-events:none;}
  .scalecard .soon{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="eyebrow">Cognisa · Área privada</div>
    <h1>Escalas Médicos</h1>
  </div>
  <nav class="panelnav">
    <a href="index.html">Painel</a>
    <a href="roteiro.html">Roteiro de Atendimento</a>
    <a href="prontuario.html">Prontuário</a>
    <a href="escalas.html" class="active">Escalas Médicos</a>
    <a href="completude.html">Completude</a>
  </nav>
  <button id="logoutBtn">Sair</button>
</header>

<div class="wrap">
  <div class="card" id="searchCard">
    <h2>1. Selecionar paciente</h2>
    <div class="searchrow">
      <input type="text" id="searchInitials" placeholder="Buscar por iniciais...">
      <button id="searchBtn">Buscar</button>
    </div>
    <div class="resultlist" id="resultList"></div>
  </div>

  <div class="card" id="patientCard" style="display:none;">
    <div class="patienthead">
      <div>
        <div class="id" id="patientId">—</div>
        <div class="sub" id="patientSub">—</div>
      </div>
      <button class="changepatient" id="changePatientBtn">Trocar paciente</button>
    </div>
  </div>

  <div class="card" id="scalesCard" style="display:none;">
    <h2>2. Escolher escala</h2>
    <div class="scalegrid" id="scaleGrid"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://wkubjtnwipqlrynauvpa.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_H0O-YMO7H7QA-dZIQbZnJQ_AdaCXWtb";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const SCALES = [
    { file: "escala-katz.html", name: "Katz — ABVD", desc: "Independência para atividades básicas de vida diária", ready: true },
    { file: "escala-lawton.html", name: "Lawton-Brody — AIVD", desc: "Independência para atividades instrumentais", ready: true },
    { file: "escala-gds15.html", name: "GDS-15", desc: "Rastreio de depressão geriátrica", ready: true },
    { file: "escala-gad7.html", name: "GAD-7", desc: "Rastreio de ansiedade", ready: true },
    { file: "escala-moca.html", name: "MoCA", desc: "Rastreio cognitivo", ready: true },
    { file: "escala-meem.html", name: "MEEM", desc: "Mini Exame do Estado Mental", ready: true },
    { file: "escala-mna.html", name: "MNA-SF", desc: "Rastreio nutricional", ready: true },
    { file: "escala-imc.html", name: "IMC", desc: "Peso, altura e classificação", ready: true },
    { file: "escala-zarit.html", name: "Zarit", desc: "Sobrecarga do cuidador", ready: true },
    { file: "escala-ivcf20.html", name: "IVCF-20", desc: "Índice de Vulnerabilidade Clínico-Funcional", ready: true },
    { file: "escala-sarcf.html", name: "SARC-F", desc: "Rastreio de sarcopenia", ready: true },
    { file: "escala-sono.html", name: "Diário de Sono", desc: "Qualidade do sono, insônia, sonolência diurna", ready: true },
    { file: "escala-npiq.html", name: "NPI-Q", desc: "Sintomas neuropsiquiátricos e estresse do cuidador", ready: true },
    { file: "escala-ivsf10.html", name: "IVSF-10", desc: "Vulnerabilidade social e familiar", ready: true },
    { file: "escala-cfi.html", name: "CFI", desc: "Função cognitiva percebida — paciente e informante", ready: true },
    { file: "escala-aua.html", name: "AUA-Score / IPSS", desc: "Sintomas urinários", ready: true },
    { file: "escala-audit.html", name: "AUDIT", desc: "Uso de álcool", ready: true },
    { file: "escala-bode.html", name: "BODE Index", desc: "Prognóstico em DPOC", ready: true },
    { file: "escala-braden.html", name: "Escala de Braden", desc: "Risco de lesão por pressão", ready: true },
    { file: "escala-asa.html", name: "Classificação ASA", desc: "Risco anestésico (não gravado — evento pontual)", ready: true },
    { file: "escala-curb65.html", name: "CURB-65", desc: "Gravidade de pneumonia (não gravado — evento pontual)", ready: true },
  ];

  function renderScales(patientId){
    const grid = document.getElementById('scaleGrid');
    grid.innerHTML = SCALES.map(s => {
      const href = `${s.file}?patient_id=${patientId}`;
      return s.ready
        ? `<a class="scalecard" href="${href}"><div class="name">${s.name}</div><div class="desc">${s.desc}</div></a>`
        : `<div class="scalecard disabled"><div class="name">${s.name}</div><div class="desc">${s.desc}</div><div class="soon">Em breve</div></div>`;
    }).join('');
  }

  async function requireSession(){
    const { data } = await client.auth.getSession();
    if (!data.session) { window.location.href = "login.html"; return null; }
    return data.session;
  }

  function formatDate(iso){
    if(!iso) return '';
    const [ano, mes, dia] = iso.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  async function searchPatients(){
    const term = document.getElementById('searchInitials').value.trim().toUpperCase();
    const resultList = document.getElementById('resultList');
    if (!term) { resultList.innerHTML = ''; return; }

    const { data, error } = await client
      .from('patients')
      .select('id, initials, birth_date, medical_record_number')
      .ilike('initials', `%${term}%`)
      .order('initials');

    if (error) { resultList.innerHTML = `<div class="empty">Erro: ${error.message}</div>`; return; }
    if (!data || data.length === 0) { resultList.innerHTML = `<div class="empty">Nenhum paciente encontrado com essas iniciais.</div>`; return; }

    resultList.innerHTML = data.map(p => `
      <div class="resultitem" data-id="${p.id}">
        <span>${p.initials}</span>
        <span class="sub">${formatDate(p.birth_date)}${p.medical_record_number ? ' · Prontuário ' + p.medical_record_number : ''}</span>
      </div>
    `).join('');

    resultList.querySelectorAll('.resultitem').forEach(item => {
      item.addEventListener('click', () => {
        const p = data.find(x => x.id === item.dataset.id);
        selectPatient(p);
      });
    });
  }

  function selectPatient(patient){
    document.getElementById('searchCard').style.display = 'none';
    document.getElementById('patientCard').style.display = 'block';
    document.getElementById('scalesCard').style.display = 'block';
    document.getElementById('patientId').textContent =
      `${patient.initials}-${(patient.birth_date || '').replace(/-/g,'').slice(2)}`;
    document.getElementById('patientSub').textContent =
      `Nascimento ${formatDate(patient.birth_date)}${patient.medical_record_number ? ' · Prontuário ' + patient.medical_record_number : ''}`;
    renderScales(patient.id);
  }

  document.getElementById('searchBtn').addEventListener('click', searchPatients);
  document.getElementById('searchInitials').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchPatients(); });
  document.getElementById('changePatientBtn').addEventListener('click', () => {
    document.getElementById('searchCard').style.display = 'block';
    document.getElementById('patientCard').style.display = 'none';
    document.getElementById('scalesCard').style.display = 'none';
    document.getElementById('resultList').innerHTML = '';
    document.getElementById('searchInitials').value = '';
    document.getElementById('searchInitials').focus();
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.href = "login.html";
  });

  (async () => {
    const session = await requireSession();
    if (!session) return;

    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('patient_id');
    if (patientId) {
      const { data, error } = await client
        .from('patients')
        .select('id, initials, birth_date, medical_record_number')
        .eq('id', patientId)
        .maybeSingle();
      if (!error && data) selectPatient(data);
    }
  })();
</script>

</body>
</html>
